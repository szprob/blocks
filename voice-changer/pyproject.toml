[project]
name = "voice-changer-blocks"
version = "0.1.0"
description = "跨平台实时变声（男声 → 温柔女声）：RVC 引擎 + WebSocket C/S + Python 客户端"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "websockets>=12.0",
]

[project.scripts]
voice-changer-server = "voice_changer.server:main"
voice-changer-client = "voice_changer.client:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voice_changer", "voice_changer.backends"]
